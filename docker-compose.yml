version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: leadsportal
      POSTGRES_USER: leadsportal
      POSTGRES_PASSWORD: leadsportal
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

